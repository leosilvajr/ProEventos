<div class="container-fluid">
	<div class="row justify-content-center align-items-center vh-100">
	  <div class="col-10 col-sm-8 col-md-6 col-lg-4">
		<div class="login-dark p-3 shadow-lg rounded">
		  <div class="pt-3">
			<h2 class="text-white">Pro | Eventos</h2>
		  </div>
  
		  <form #loginForm="ngForm" class="mt-4" (ngSubmit)="login()">
			<div class="form-group">
			  <input [(ngModel)]="model.userName" name="username" type="email" class="form-control form-control-sm bg-light" placeholder="Insira seu e-mail" required>
			</div>
  
			<div class="form-group">
			  <input [(ngModel)]="model.password" name="password" type="password" class="form-control form-control-sm bg-light" placeholder="Insira sua senha" required>
			</div>
  
			<div class="form-group form-check">
			  <input type="checkbox" class="form-check-input" id="rememberCheckBox">
			  <label class="form-check-label text-light" for="rememberCheckBox">Lembrar-me?</label>
			</div>
  
			<div class="mt-4">
			  <button [disabled]="loginForm.invalid" class="btn btn-sm btn-light col">Login</button>
			</div>
			
			<div class="mt-4">
			  <p class="text-white text-center">
				Não tem login?
				<a routerLink="/user/registration" class="text-warning">Quero me cadastrar</a>
			  </p>
			</div>
		  </form>
		</div>
	  </div>
	</div>
  </div>
